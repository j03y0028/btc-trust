server {
    listen 9331 ssl;
    server_name btctrust;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_btctrust.log;
    error_log /var/log/nginx/error_btctrust.log;

    # Live trustee messaging (WebSocket). mynode_ssl_proxy_params.conf has no Upgrade headers.
    location /api/ws {
        proxy_pass http://127.0.0.1:9330;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:9330;
        client_max_body_size 12m;
        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
}
